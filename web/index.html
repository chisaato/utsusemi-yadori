<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1211" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c1211'/%3E%3Cpath d='M32 10 L54 32 L32 54 L10 32 Z' fill='none' stroke='%232fd9c3' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%232fd9c3'/%3E%3C/svg%3E"
    />
    <title>空蝉宿 · Utsusemi-Yadori</title>
    <script>
      // 主题预置：避免暗色用户看到白色闪烁
      ;(function () {
        try {
          var t = localStorage.getItem('utsusemi_theme')
          var d =
            t === 'dark' ||
            ((t === null || t === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches)
          if (d) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
